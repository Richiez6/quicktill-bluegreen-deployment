name: Blue-Green Deployment

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: richiez6/quicktill
  IMAGE_TAG: ${{ github.sha }}
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG

      - name: Deploy to Azure Staging Slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: quicktill-bg-richie
          slot-name: staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          images: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Wait for application
        run: sleep 30

      - name: Health Check
        run: |
          curl --fail https://quicktill-bg-richie-staging-dpehd0hkagaccnfd.southafricanorth-01.azurewebsites.net/health

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Swap Staging to Production
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp deployment slot swap \
              --resource-group quicktill-rg \
              --name quicktill-bg-richie \
              --slot staging \
              --target-slot production

      - name: Deployment Successful
        run: echo "Health check passed. Ready for slot swap."
